openapi: 3.1.0
info:
  title: PGI Telecom • Audiotel Premium Pro API
  version: 1.0.0
  description: API privée du cockpit Audiotel. Les réponses réelles nécessitent authentification.
servers:
  - url: https://api.example.invalid/api/v1
    description: Placeholder — remplacé au déploiement
paths:
  /health:
    get:
      summary: Santé de l'API
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok, degraded] }
                  timestamp: { type: string, format: date-time }
  /dashboard/summary:
    get:
      summary: KPI agrégés
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Résumé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /calls:
    get:
      summary: Liste paginée des CDR
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: expert_id, in: query, schema: { type: integer } }
        - { name: origin_carrier, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 250, default: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: CDR
  /finance/reconciliation:
    get:
      summary: Réconciliation attendue / confirmée
      responses:
        "200":
          description: Agrégats et anomalies
  /experts:
    get:
      summary: Présence et performance experts
      responses:
        "200":
          description: Experts
  /system/health:
    get:
      summary: Santé télécom et données
      responses:
        "200":
          description: Santé
  /carrier-routing:
    get:
      summary: État des routes logiques opérateur
      responses:
        "200":
          description: Opérateur actif, standby, génération et état des connexions
  /carrier-switches:
    post:
      summary: Prépare un changement d'opérateur sans modifier le cœur PGI
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [route_key, to_carrier_id, connection_id]
              properties:
                route_key: { type: string, example: sva-primary }
                to_carrier_id: { type: integer }
                connection_id: { type: integer }
                scheduled_for: { type: string, format: date-time }
                rollback_window_minutes: { type: integer, minimum: 5, maximum: 10080, default: 1440 }
      responses:
        "201":
          description: Plan de bascule créé
  /carrier-switches/{id}/activate:
    post:
      summary: Active atomiquement la nouvelle route après validation
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Nouvelle route active, ancienne route conservée en standby
  /carrier-switches/{id}/rollback:
    post:
      summary: Revient à l'opérateur précédent pendant la fenêtre de rollback
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Rollback effectué
  /metrics/baselines:
    post:
      summary: Crée une nouvelle baseline sans supprimer les données
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
          description: Empêche la création en double lors d'un retry réseau.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope]
              properties:
                scope: { type: string, enum: [global, expert, sva_number] }
                scope_id: { type: integer }
                reason: { type: string, maxLength: 500 }
      responses:
        "201":
          description: Baseline créée
        "409":
          description: Clé d'idempotence déjà utilisée avec une requête différente
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: pgi_session
  schemas:
    DashboardSummary:
      type: object
      required:
        - generated_revenue_ttc
        - expected_payout_ht
        - confirmed_payout_ht
        - calls_total
        - billable_minutes
      properties:
        generated_revenue_ttc: { type: number }
        expected_payout_ht: { type: number }
        confirmed_payout_ht: { type: number }
        paid_payout_ht: { type: number }
        estimated_margin_ht: { type: number }
        calls_total: { type: integer }
        calls_connected: { type: integer }
        calls_abandoned: { type: integer }
        calls_failed: { type: integer }
        billable_minutes: { type: number }
        payout_eligible_minutes: { type: number }
        acd_seconds: { type: number }
        asr_percent: { type: number }
        active_experts: { type: integer }
        live_calls: { type: integer }
        queue_depth: { type: integer }
security:
  - sessionCookie: []
