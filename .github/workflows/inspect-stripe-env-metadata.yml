name: Inspect Stripe Env Metadata

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/inspect-stripe-env-metadata.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: prj_Qjf77bDx4QwOcaV2yPKfUVv9TE0q
      VERCEL_TEAM_ID: team_GhbILdoZUN5puKJdrKp5nPQg
    steps:
      - name: Print Stripe variable metadata only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          curl --fail --silent --show-error             -H "Authorization: Bearer $VERCEL_TOKEN"             "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_TEAM_ID"             | jq -r '.envs[] | select(.key|test("STRIPE|BILLING")) | [.key,.type,((.target // [])|join(","))] | @tsv'
