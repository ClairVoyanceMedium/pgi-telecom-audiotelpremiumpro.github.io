name: Bootstrap Stripe Connect Webhook

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/bootstrap-stripe-connect-webhook.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootstrap-stripe-connect-webhook
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: prj_Qjf77bDx4QwOcaV2yPKfUVv9TE0q
      VERCEL_TEAM_ID: team_GhbILdoZUN5puKJdrKp5nPQg
      VERCEL_PROJECT_NAME: pgi-telecom-audiotelpremiumpro-github-io
      CONNECT_WEBHOOK_URL: https://audiotel-premium-pro.com/api/v1/billing/stripe/connect-webhook

    steps:
      - name: Verify Vercel authorization
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          echo "::add-mask::$VERCEL_TOKEN"

      - name: Read Stripe production key from Vercel without logging it
        id: production
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          env_file="$(mktemp)"
          curl --fail --silent --show-error             -H "Authorization: Bearer $VERCEL_TOKEN"             "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_TEAM_ID&decrypt=true"             > "$env_file"

          stripe_key="$(jq -r '.envs[] | select(.key=="PGI_STRIPE_SECRET_KEY") | select((.target // []) | index("production")) | .value // empty' "$env_file" | head -n1)"
          billing_enabled="$(jq -r '.envs[] | select(.key=="PGI_EXTERNAL_BILLING_ENABLED") | select((.target // []) | index("production")) | .value // empty' "$env_file" | head -n1)"

          [[ "$stripe_key" =~ ^sk_live_[A-Za-z0-9]+$ ]]
          [[ "$billing_enabled" == "true" ]]
          echo "::add-mask::$stripe_key"

          key_file="$(mktemp)"
          chmod 600 "$key_file"
          printf '%s' "$stripe_key" > "$key_file"
          rm -f "$env_file"
          echo "key_file=$key_file" >> "$GITHUB_OUTPUT"

      - name: Create disabled Connect webhook and capture signing secret
        id: stripe
        shell: bash
        run: |
          set -euo pipefail
          stripe_key="$(cat "${{ steps.production.outputs.key_file }}")"
          echo "::add-mask::$stripe_key"
          webhook_id=""

          cleanup() {
            code=$?
            if [ "$code" -ne 0 ] && [ -n "$webhook_id" ]; then
              curl --silent --show-error -X POST                 -H "Authorization: Bearer $stripe_key"                 --data "disabled=true"                 "https://api.stripe.com/v1/webhook_endpoints/$webhook_id" >/dev/null || true
            fi
            rm -f "${{ steps.production.outputs.key_file }}" /tmp/pgi-stale-webhooks.json
            exit "$code"
          }
          trap cleanup EXIT

          curl --fail --silent --show-error             -H "Authorization: Bearer $stripe_key"             -H "Stripe-Version: 2026-08-26.dahlia"             "https://api.stripe.com/v1/webhook_endpoints?limit=100"             > /tmp/pgi-stale-webhooks.json

          mapfile -t stale_ids < <(jq -r --arg url "$CONNECT_WEBHOOK_URL" '.data[] | select(.url==$url) | .id' /tmp/pgi-stale-webhooks.json)

          args=(
            --fail --silent --show-error
            -X POST
            -H "Authorization: Bearer $stripe_key"
            -H "Stripe-Version: 2026-08-26.dahlia"
            --data-urlencode "url=$CONNECT_WEBHOOK_URL"
            --data "connect=true"
            --data-urlencode "api_version=2026-08-26.dahlia"
            --data-urlencode "description=PGI Telecom • Audiotel Premium Pro — Stripe Connect paiements CB"
            --data-urlencode "metadata[service]=audiotel_premium_pro"
            --data-urlencode "metadata[purpose]=connect_card_payments"
            --data-urlencode "metadata[environment]=production"
          )
          for event in             account.updated             capability.updated             checkout.session.completed             checkout.session.async_payment_succeeded             checkout.session.async_payment_failed             checkout.session.expired             payment_intent.succeeded             payment_intent.payment_failed             charge.refunded             refund.created             refund.updated             refund.failed             charge.dispute.created             charge.dispute.updated             charge.dispute.closed
          do
            args+=(--data-urlencode "enabled_events[]=$event")
          done

          response="$(curl "${args[@]}" https://api.stripe.com/v1/webhook_endpoints)"
          webhook_id="$(jq -r '.id // empty' <<<"$response")"
          signing_secret="$(jq -r '.secret // empty' <<<"$response")"
          [[ "$webhook_id" =~ ^we_[A-Za-z0-9]+$ ]]
          [[ "$signing_secret" =~ ^whsec_[A-Za-z0-9]+$ ]]
          echo "::add-mask::$signing_secret"

          curl --fail --silent --show-error -X POST             -H "Authorization: Bearer $stripe_key"             --data "disabled=true"             "https://api.stripe.com/v1/webhook_endpoints/$webhook_id" >/dev/null

          secret_file="$(mktemp)"
          chmod 600 "$secret_file"
          printf '%s' "$signing_secret" > "$secret_file"
          printf '%s\n' "${stale_ids[@]}" > /tmp/pgi-stale-webhooks.txt

          echo "webhook_id=$webhook_id" >> "$GITHUB_OUTPUT"
          echo "secret_file=$secret_file" >> "$GITHUB_OUTPUT"
          trap - EXIT
          rm -f /tmp/pgi-stale-webhooks.json

      - name: Store signing secret as a sensitive Vercel production variable
        shell: bash
        run: |
          set -euo pipefail
          signing_secret="$(cat "${{ steps.stripe.outputs.secret_file }}")"
          echo "::add-mask::$signing_secret"
          payload="$(jq -nc --arg value "$signing_secret" '{
            key:"PGI_STRIPE_CONNECT_WEBHOOK_SECRET",
            value:$value,
            type:"sensitive",
            target:["production"],
            comment:"Stripe Connect webhook signing secret — Audiotel Premium Pro"
          }')"
          curl --fail --silent --show-error             -X POST             -H "Authorization: Bearer $VERCEL_TOKEN"             -H "Content-Type: application/json"             --data "$payload"             "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_TEAM_ID&upsert=true"             >/dev/null

      - name: Redeploy production with the new secret
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          latest="$(curl --fail --silent --show-error             -H "Authorization: Bearer $VERCEL_TOKEN"             "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&target=production&limit=1&teamId=$VERCEL_TEAM_ID"             | jq -r '.deployments[0].uid // .deployments[0].id // empty')"
          [[ "$latest" =~ ^dpl_ ] ] && exit 1 || true
          [[ "$latest" =~ ^dpl_[A-Za-z0-9]+$ ]]

          body="$(jq -nc --arg name "$VERCEL_PROJECT_NAME" --arg deploymentId "$latest" '{
            name:$name,
            deploymentId:$deploymentId,
            target:"production"
          }')"
          response="$(curl --fail --silent --show-error             -X POST             -H "Authorization: Bearer $VERCEL_TOKEN"             -H "Content-Type: application/json"             --data "$body"             "https://api.vercel.com/v13/deployments?teamId=$VERCEL_TEAM_ID")"
          deployment_id="$(jq -r '.id // .uid // empty' <<<"$response")"
          [[ "$deployment_id" =~ ^dpl_[A-Za-z0-9]+$ ]]
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"

      - name: Wait for production and verify signature enforcement
        shell: bash
        run: |
          set -euo pipefail
          deployment_id="${{ steps.deploy.outputs.deployment_id }}"
          deadline=$((SECONDS+420))
          while [ "$SECONDS" -lt "$deadline" ]; do
            state="$(curl --fail --silent --show-error               -H "Authorization: Bearer $VERCEL_TOKEN"               "https://api.vercel.com/v13/deployments/$deployment_id?teamId=$VERCEL_TEAM_ID"               | jq -r '.readyState // .state // empty')"
            if [ "$state" = "READY" ]; then break; fi
            if [ "$state" = "ERROR" ] || [ "$state" = "CANCELED" ]; then exit 1; fi
            sleep 5
          done

          status="$(curl --silent --show-error --output /tmp/pgi-connect-probe.json --write-out '%{http_code}'             -X POST             -H 'Content-Type: application/json'             -H 'Stripe-Signature: t=0,v1=0'             --data '{}'             "$CONNECT_WEBHOOK_URL" || true)"
          [ "$status" = "400" ]
          grep -Eq 'STRIPE_SIGNATURE_INVALID|signature' /tmp/pgi-connect-probe.json || true

      - name: Enable verified Stripe Connect webhook and remove stale duplicates
        shell: bash
        run: |
          set -euo pipefail
          stripe_key="$(cat "${{ steps.production.outputs.key_file }}")"
          webhook_id="${{ steps.stripe.outputs.webhook_id }}"
          echo "::add-mask::$stripe_key"

          enabled="$(curl --fail --silent --show-error -X POST             -H "Authorization: Bearer $stripe_key"             --data "disabled=false"             "https://api.stripe.com/v1/webhook_endpoints/$webhook_id")"
          [ "$(jq -r '.status' <<<"$enabled")" = "enabled" ]

          if [ -f /tmp/pgi-stale-webhooks.txt ]; then
            while IFS= read -r stale_id; do
              [ -n "$stale_id" ] || continue
              [ "$stale_id" = "$webhook_id" ] && continue
              curl --fail --silent --show-error -X DELETE                 -H "Authorization: Bearer $stripe_key"                 "https://api.stripe.com/v1/webhook_endpoints/$stale_id" >/dev/null
            done < /tmp/pgi-stale-webhooks.txt
          fi

          rm -f "${{ steps.production.outputs.key_file }}" "${{ steps.stripe.outputs.secret_file }}" /tmp/pgi-stale-webhooks.txt /tmp/pgi-connect-probe.json
          echo "Stripe Connect webhook enabled: $webhook_id"
