name: Fix Stripe Live Mode

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fix-stripe-live-mode.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: prj_Qjf77bDx4QwOcaV2yPKfUVv9TE0q
      VERCEL_TEAM_ID: team_GhbILdoZUN5puKJdrKp5nPQg
    steps:
      - name: Enable Stripe production billing in Vercel
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          echo "::add-mask::$VERCEL_TOKEN"

          upsert_plain() {
            key="$1"
            value="$2"
            payload="$(jq -nc --arg key "$key" --arg value "$value" '{key:$key,value:$value,type:"plain",target:["production"],comment:"Stripe production billing configuration"}')"
            curl --fail --silent --show-error \
              -X POST \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$payload" \
              "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_TEAM_ID&upsert=true" \
              >/dev/null
          }

          upsert_plain "PGI_STRIPE_LIVE_MODE" "true"
          upsert_plain "PGI_EXTERNAL_BILLING_ENABLED" "true"

          current="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_TEAM_ID")"
          has_token="$(jq -r '[.envs[] | select(.key=="PGI_BILLING_INGEST_TOKEN") | select((.target // []) | index("production"))] | length' <<<"$current")"

          if [ "$has_token" = "0" ]; then
            token="$(openssl rand -hex 32)"
            echo "::add-mask::$token"
            payload="$(jq -nc --arg value "$token" '{key:"PGI_BILLING_INGEST_TOKEN",value:$value,type:"sensitive",target:["production"],comment:"Internal billing ingest token"}')"
            curl --fail --silent --show-error \
              -X POST \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$payload" \
              "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_TEAM_ID&upsert=true" \
              >/dev/null
          fi
