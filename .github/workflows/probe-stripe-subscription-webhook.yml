name: Probe Stripe Subscription Webhook

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/probe-stripe-subscription-webhook.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify invalid Stripe subscription signature is rejected
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output response.txt --write-out '%{http_code}'             -X POST             -H 'Content-Type: application/json'             -H 'Stripe-Signature: t=0,v1=0'             --data '{"id":"evt_probe","type":"probe.invalid"}'             'https://audiotel-premium-pro.com/api/v1/billing/stripe/webhook')"
          cat response.txt
          test "$code" = "400"
