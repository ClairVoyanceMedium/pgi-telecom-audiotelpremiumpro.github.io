name: pgi-telecom-production

services:
  api:
    image: pgi-telecom-api:${PGI_VERSION:-1.23.0}
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      PGI_BACKEND_MODE: production
      PGI_AUTH_MODE: session
      PGI_BACKEND_HOST: 0.0.0.0
      PGI_BACKEND_PORT: 8080
      PGI_PROCESS_ROLE: ${PGI_PROCESS_ROLE:-all}
      PGI_VERSION: ${PGI_VERSION:-1.23.0}
      PGI_RELEASE_ID: ${PGI_RELEASE_ID}
      PGI_DATABASE_URL: postgresql://${POSTGRES_USER:-pgi_telecom}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pgi_telecom}
      PGI_DATABASE_READ_URL: ${PGI_DATABASE_READ_URL:-}
      PGI_DATABASE_SSL: disable
      PGI_DATABASE_POOL_MAX: ${PGI_DATABASE_POOL_MAX:-10}
      PGI_DATABASE_READ_POOL_MAX: ${PGI_DATABASE_READ_POOL_MAX:-20}
      PGI_WORKER_LEASE_SECONDS: ${PGI_WORKER_LEASE_SECONDS:-45}
      PGI_WORK_QUEUE_BATCH_SIZE: ${PGI_WORK_QUEUE_BATCH_SIZE:-25}
      PGI_WORK_QUEUE_LEASE_SECONDS: ${PGI_WORK_QUEUE_LEASE_SECONDS:-60}
      PGI_WORK_QUEUE_RETRY_BASE_SECONDS: ${PGI_WORK_QUEUE_RETRY_BASE_SECONDS:-15}
      PGI_WORK_QUEUE_POLL_MS: ${PGI_WORK_QUEUE_POLL_MS:-1000}
      PGI_REQUIRE_CARRIER_CONTRACT: ${PGI_REQUIRE_CARRIER_CONTRACT:-true}
      PGI_SESSION_SECRET: ${PGI_SESSION_SECRET}
      PGI_ADMIN_USERNAME: ${PGI_ADMIN_USERNAME:-admin}
      PGI_ADMIN_PASSWORD_HASH: ${PGI_ADMIN_PASSWORD_HASH}
      PGI_AUTH_MAX_FAILURES: ${PGI_AUTH_MAX_FAILURES:-8}
      PGI_AUTH_FAILURE_WINDOW_SECONDS: ${PGI_AUTH_FAILURE_WINDOW_SECONDS:-900}
      PGI_GOOGLE_CLIENT_ID: ${PGI_GOOGLE_CLIENT_ID:-}
      PGI_OUTBOX_WORKER_STALE_SECONDS: ${PGI_OUTBOX_WORKER_STALE_SECONDS:-15}
      PGI_ALERTS_WORKER_STALE_SECONDS: ${PGI_ALERTS_WORKER_STALE_SECONDS:-120}
      PGI_SHUTDOWN_GRACE_MS: ${PGI_SHUTDOWN_GRACE_MS:-10000}
      PGI_MAX_EVENT_SUBSCRIBERS: ${PGI_MAX_EVENT_SUBSCRIBERS:-32}
      PGI_INGEST_TOKEN: ${PGI_INGEST_TOKEN}
      PGI_TELEPHONY_USER: ${PGI_TELEPHONY_USER}
      PGI_TELEPHONY_PASSWORD: ${PGI_TELEPHONY_PASSWORD}
      PGI_CALLER_HASH_KEY: ${PGI_CALLER_HASH_KEY}
      PGI_PORTABILITY_SECRET_KEY: ${PGI_PORTABILITY_SECRET_KEY}
      PGI_SERVICE_RATE_TTC_PER_MIN: ${PGI_SERVICE_RATE_TTC_PER_MIN:-0.80}
      PGI_PAYOUT_RATE_HT_PER_MIN: ${PGI_PAYOUT_RATE_HT_PER_MIN:-0}
      PGI_EXPERT_COST_HT_PER_MIN: ${PGI_EXPERT_COST_HT_PER_MIN:-0.18}
      PGI_TECHNICAL_COST_HT_PER_CALL: ${PGI_TECHNICAL_COST_HT_PER_CALL:-0}
      PGI_RECONCILIATION_TOLERANCE_HT: ${PGI_RECONCILIATION_TOLERANCE_HT:-0.01}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    networks:
      - core
    stop_grace_period: 20s


  migrate:
    image: pgi-telecom-api:${PGI_VERSION:-1.23.0}
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: "no"
    command: ["node","backend/migrate.mjs"]
    environment:
      PGI_DATABASE_URL: postgresql://${POSTGRES_USER:-pgi_telecom}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pgi_telecom}
      PGI_DATABASE_SSL: disable
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    networks:
      - core

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pgi_telecom}
      POSTGRES_USER: ${POSTGRES_USER:-pgi_telecom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgi_postgres_data:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ../database/views.sql:/docker-entrypoint-initdb.d/002-views.sql:ro
    networks:
      - core
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${POSTGRES_USER:-pgi_telecom} -d ${POSTGRES_DB:-pgi_telecom}"]
      interval: 10s
      timeout: 5s
      retries: 10
    stop_grace_period: 30s


volumes:
  pgi_postgres_data:

networks:
  core:
    driver: bridge
