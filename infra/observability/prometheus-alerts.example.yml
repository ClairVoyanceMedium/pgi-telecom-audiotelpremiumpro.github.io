groups:
  - name: pgi-slo
    rules:
      - alert: PGIApiFastErrorBudgetBurn
        expr: |
          (
            sum(rate(pgi_http_responses_total{status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(pgi_http_requests_total[5m])), 0.001)
          ) > 0.0144
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "API error budget burning too fast"
          description: "5xx ratio is above the 14.4x burn threshold for a 99.9% availability SLO."

      - alert: PGIApiSlowErrorBudgetBurn
        expr: |
          (
            sum(rate(pgi_http_responses_total{status=~"5.."}[1h]))
            /
            clamp_min(sum(rate(pgi_http_requests_total[1h])), 0.001)
          ) > 0.006
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "API error budget burn is sustained"
          description: "The one-hour 5xx ratio is consuming the monthly availability budget too quickly."

      - alert: PGIApiLatencyP95High
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, route) (rate(pgi_http_request_duration_ms_bucket[10m]))
          ) > 500
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "API p95 latency above 500 ms"

      - alert: PGICdrLagCritical
        expr: pgi_cdr_lag_seconds > 900
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "CDR pipeline is more than 15 minutes behind"

      - alert: PGIOutboxBacklog
        expr: pgi_outbox_pending > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Outbox backlog is growing"

      - alert: PGIWorkQueueOldestPending
        expr: pgi_work_queue_oldest_pending_seconds > 120
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Distributed work queue has old pending work"

      - alert: PGIWorkQueueDeadLetter
        expr: pgi_work_queue_dead_lettered > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "At least one job reached the dead-letter queue"

      - alert: PGIOutboxWorkerStale
        expr: |
          pgi_worker_outbox_last_success_unixtime > 0
          and
          (time() - pgi_worker_outbox_last_success_unixtime) > 60
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Outbox worker has stopped making progress"

      - alert: PGIQueueWorkerStale
        expr: |
          pgi_worker_queue_last_success_unixtime > 0
          and
          (time() - pgi_worker_queue_last_success_unixtime) > 120
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Queue workers are not making progress"

      - alert: PGIServiceCriticalIncident
        expr: pgi_service_incidents_critical > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Dossier client critique ouvert"
          description: "Au moins un dossier critique est actuellement ouvert dans le centre de service PGI."

      - alert: PGIServiceFirstResponseOverdue
        expr: pgi_service_first_response_overdue > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Objectif de première prise en charge dépassé"
          description: "Un ou plusieurs dossiers n'ont pas reçu de première prise en charge avant leur cible interne."

      - alert: PGIServiceResolutionOverdue
        expr: pgi_service_resolution_overdue > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Objectif de résolution dépassé"
          description: "Un ou plusieurs dossiers actifs ont dépassé leur cible interne de résolution."

      - alert: PGIRoutingUnavailable
        expr: pgi_routing_unavailable > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Routage client indisponible"
          description: "PGI détecte au moins un client actif sans destination ni expert disponible."

      - alert: PGIPortabilityAttention
        expr: pgi_portability_attention > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Portabilité nécessitant une intervention"
          description: "Au moins une portabilité automatique est en échec ou requiert une action PGI."
